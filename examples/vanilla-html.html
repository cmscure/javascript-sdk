<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMSCure SDK – Vanilla HTML Example</title>
    <!-- Load the SDK from CDN (or use npm: import CMSCureSDK from '@cmscure/javascript-sdk') -->
    <script src="https://cdn.jsdelivr.net/npm/@cmscure/javascript-sdk@1.4.4/dist/cmscure.umd.min.js"></script>
    <style>
        :root {
            --primary-color: #663BEB;
            --secondary-color: #3B82F6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 24px;
            line-height: 1.6;
            color: #1a1a1a;
            background: #fafafa;
        }

        /* ── Hero ─────────────────────────────────── */
        .hero {
            text-align: center;
            padding: 48px 24px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: #fff;
            border-radius: 12px;
            margin-bottom: 32px;
        }
        .hero h1 { font-size: 2rem; margin-bottom: 8px; }
        .hero p  { font-size: 1.1rem; opacity: .9; }
        .hero img {
            max-width: 100%;
            height: 260px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 20px;
        }

        /* ── Language selector ────────────────────── */
        .language-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 24px 0;
        }
        .language-bar select {
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid #ddd;
            font-size: 0.95rem;
        }

        /* ── Data store grid ─────────────────────── */
        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 32px 0 16px;
        }
        .store-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }
        .store-card {
            border: 1px solid #e5e5e5;
            padding: 20px;
            border-radius: 10px;
            background: #fff;
        }
        .store-card h3 { margin-bottom: 6px; }
        .store-card p  { color: #555; font-size: 0.92rem; }

        /* ── Footer ──────────────────────────────── */
        .footer {
            text-align: center;
            margin-top: 48px;
            padding-top: 20px;
            border-top: 1px solid #e5e5e5;
            color: #888;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- ── Hero section (translations + image + color) ─── -->
    <div class="hero">
        <h1 id="brand">[Loading Brand…]</h1>
        <p  id="subtitle">[Loading Subtitle…]</p>
        <img id="banner" src="https://placehold.co/600x260/EEE/999?text=Loading..." alt="Hero banner">
    </div>

    <!-- ── Language selector ─── -->
    <div class="language-bar">
        <label for="lang-select">🌍 Language:</label>
        <select id="lang-select"></select>
    </div>

    <!-- ── Data store items ─── -->
    <h2 class="section-title" id="store-title">Products</h2>
    <div class="store-grid" id="store-grid">
        <p style="color:#999">Loading data store…</p>
    </div>

    <!-- ── Footer ─── -->
    <div class="footer">
        <p id="footer-text">Powered by CMSCure</p>
    </div>

    <script>
        // ─────────────────────────────────────────────
        // 1. Create & configure
        // ─────────────────────────────────────────────
        const cure = new CMSCureSDK();

        cure.configure({
            projectId:     'YOUR_PROJECT_ID',          // ← replace
            apiKey:        'YOUR_API_KEY',              // ← replace
            projectSecret: 'YOUR_PROJECT_SECRET',       // ← optional: enables real-time updates
            defaultLanguage: 'en'
        });

        // ─────────────────────────────────────────────
        // 2. Observe translations (auto-sync + realtime)
        // ─────────────────────────────────────────────
        cure.observe('common:brand_name', value => {
            document.getElementById('brand').textContent = value ?? '[common:brand_name]';
        }, { defaultValue: '[common:brand_name]' });

        cure.observe('homepage:hero_subtitle', value => {
            document.getElementById('subtitle').textContent = value ?? '[homepage:hero_subtitle]';
        }, { defaultValue: '[homepage:hero_subtitle]' });

        cure.observe('common:footer_text', value => {
            document.getElementById('footer-text').textContent = value ?? 'Powered by CMSCure';
        }, { defaultValue: 'Powered by CMSCure' });

        // ─────────────────────────────────────────────
        // 3. Observe an image
        // ─────────────────────────────────────────────
        cure.observe('image:deals_banner', value => {
            const img = document.getElementById('banner');
            if (typeof value === 'string' && value) {
                img.src = value;
            }
        }, { defaultValue: null });

        // ─────────────────────────────────────────────
        // 4. Observe colors → CSS custom properties
        // ─────────────────────────────────────────────
        cure.observe('color:primary_color', value => {
            if (typeof value === 'string' && value) {
                document.documentElement.style.setProperty('--primary-color', value);
            }
        }, { defaultValue: '#663BEB' });

        cure.observe('color:secondary_color', value => {
            if (typeof value === 'string' && value) {
                document.documentElement.style.setProperty('--secondary-color', value);
            }
        }, { defaultValue: '#3B82F6' });

        // ─────────────────────────────────────────────
        // 5. Observe a data store
        // ─────────────────────────────────────────────
        cure.observe('store:products', items => {
            const grid = document.getElementById('store-grid');
            if (!Array.isArray(items) || items.length === 0) {
                grid.innerHTML = '<p style="color:#999">No products found.</p>';
                return;
            }

            grid.innerHTML = items.map(item => `
                <div class="store-card">
                    <h3>${escapeHtml(item.name ?? item.title ?? 'Untitled')}</h3>
                    <p>${escapeHtml(item.description ?? '')}</p>
                </div>
            `).join('');
        }, { defaultValue: [] });

        // ─────────────────────────────────────────────
        // 6. Language selector (auto-populated)
        // ─────────────────────────────────────────────
        const langSelect = document.getElementById('lang-select');

        const LANG_NAMES = {
            en: 'English', fr: 'Français', es: 'Español',
            de: 'Deutsch', it: 'Italiano', pt: 'Português',
            ar: 'العربية', zh: '中文', ja: '日本語', ko: '한국어'
        };

        cure.observe('meta:languages', langs => {
            const list = Array.isArray(langs) ? langs : ['en'];
            const current = cure.getLanguage();
            langSelect.innerHTML = list.map(code =>
                `<option value="${code}" ${code === current ? 'selected' : ''}>${LANG_NAMES[code] || code.toUpperCase()}</option>`
            ).join('');
        }, { defaultValue: ['en'] });

        langSelect.addEventListener('change', e => cure.setLanguage(e.target.value));

        // ─────────────────────────────────────────────
        // Helpers
        // ─────────────────────────────────────────────
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
</body>
</html>
